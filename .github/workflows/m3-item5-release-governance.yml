name: M3 Item 5 Release Governance

on:
  pull_request:
    paths:
      - "app/release_governance.py"
      - "app/main.py"
      - "app/schema.sql"
      - "migrations/M3_ITEM5_RELEASE_GOVERNANCE_001.sql"
      - "docs/M3_ITEM5_RELEASE_GOVERNANCE.md"
      - "tests/test_m3_item5_release_governance.py"
      - ".github/workflows/m3-item5-release-governance.yml"

permissions:
  contents: read

jobs:
  item5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Item 5 focused tests
        env:
          PYTHONPATH: .
          M3_RELEASE_GOVERNANCE_ENABLED: "true"
        run: pytest -q tests/test_m3_item5_release_governance.py
      - name: Item 4 regression
        env:
          PYTHONPATH: .
          M3_STATE_TRANSITION_GOVERNANCE_ENABLED: "true"
        run: pytest -q tests/test_m3_item4_state_transition_governance.py
      - name: Item 3 regression
        env:
          PYTHONPATH: .
          M3_OPERATIONAL_GROUPING_ENABLED: "true"
        run: pytest -q tests/test_m3_item3_cardinality_operational_grouping.py
      - name: CRT/TRT regression
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_m3_crt_governance_trt_rename.py
      - name: Item 2 regression
        env:
          PYTHONPATH: .
          M3_JOB_IDEMPOTENCY_ENABLED: "true"
          M3_JOB_MODES_ENABLED: "true"
        run: pytest -q tests/test_m3_item2_job_modes.py
      - name: Item 1 regression
        env:
          PYTHONPATH: .
          M3_JOB_IDEMPOTENCY_ENABLED: "true"
        run: pytest -q tests/test_m3_item1_job_idempotency.py
      - name: Stage 0 regression
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_m3_stage0_baseline_freeze.py
      - name: Full M3 regression
        env: {PYTHONPATH: .}
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
