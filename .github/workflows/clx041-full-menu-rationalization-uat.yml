name: M3 CLX041 Full Menu Rationalization UAT
on:
  pull_request:
    branches: [main]
    paths:
      - "app/screen_catalog.py"
      - "tests/test_clx041_full_menu_rationalization.py"
      - ".github/workflows/clx041-full-menu-rationalization-uat.yml"
  workflow_dispatch:
jobs:
  clx041-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-041 full menu hierarchy
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx041_full_menu_rationalization.py
      - name: Preserve CLX-040/039/038 + role/responsive/governance
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx040_top_level_menu_order.py
          tests/test_clx039_executive_home.py
          tests/test_clx038_agent_tasks_menu.py
          tests/test_clx037_ui_polish.py
          tests/test_clx035_ho_completion.py
          tests/test_clx034_smart_approval_fast_track.py
          tests/test_clx033_finance_transaction_governance.py
          tests/test_clx032_finance_controls.py
          tests/test_clx030_finance_entitlements.py
          tests/test_clx029_accounting_navigation_access.py
