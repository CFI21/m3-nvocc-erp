name: M3 Item 1 Job Idempotency

on:
  pull_request:
    paths:
      - "app/job_creation_idempotency.py"
      - "app/schema.sql"
      - "migrations/M3_ITEM1_JOB_IDEMPOTENCY_001.sql"
      - "tests/test_m3_item1_job_idempotency.py"
      - "docs/M3_ITEM1_JOB_CREATION_IDEMPOTENCY.md"
      - ".github/workflows/m3-item1-job-idempotency.yml"

permissions:
  contents: read

jobs:
  item1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Item 1 focused tests
        env:
          PYTHONPATH: .
          M3_JOB_IDEMPOTENCY_ENABLED: "true"
        run: pytest -q tests/test_m3_item1_job_idempotency.py
      - name: Stage 0 regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_m3_stage0_baseline_freeze.py
      - name: Full M3 regression
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
