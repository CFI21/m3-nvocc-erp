name: M3 Isolated CI

on:
  push:
    branches:
      - preview-pr124-booking-isolated
      - m3-dev-sprint-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-isolated-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.head_ref == 'preview-pr124-booking-isolated' || github.ref_name == 'preview-pr124-booking-isolated' || github.head_ref == 'm3-dev-sprint-2' || github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      DATABASE_URL: ""
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q app
      - name: Run regression tests
        id: pytest
        shell: bash
        run: |
          mkdir -p ci-proof
          set +e
          python -m pytest -q 2>&1 | tee ci-proof/pytest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > ci-proof/pytest-exit-code.txt
          exit "$result"
      - name: Publish concise failure evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## M3 Pytest verification"
            if test -f ci-proof/pytest-exit-code.txt; then
              echo "Exit code: $(cat ci-proof/pytest-exit-code.txt)"
            else
              echo "Exit code: UNKNOWN"
            fi
            echo '~~~'
            if test -f ci-proof/pytest.log; then
              grep -E '^FAILED |^[0-9]+ failed|^[0-9]+ passed|^ERROR ' ci-proof/pytest.log | tail -n 80 || true
            else
              echo "pytest log unavailable"
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ci-proof/
          if-no-files-found: error
          retention-days: 7
  isolated-api-availability:
    # Free-tier availability is a separate gate, not an application assertion.
    if: github.head_ref == 'm3-dev-sprint-2' || github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose isolated API DNS, TCP, TLS and first HTTP response
        shell: bash
        env:
          API: https://m3-dev-sprint2-isolated-api.onrender.com
        run: |
          set -euo pipefail
          python3 - <<'PYDNS'
          import socket
          host = 'm3-dev-sprint2-isolated-api.onrender.com'
          try:
              addresses = sorted({entry[4][0] for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print(f'DNS_DIAG host={host} status=PASS addresses={",".join(addresses)}')
          except OSError as exc:
              print(f'DNS_DIAG host={host} status=FAIL reason={type(exc).__name__}')
          PYDNS
          # No credentials, writes, deployment or external side effects: GET only.
          for attempt in 1 2 3; do
            rc=0
            timings="$(curl --request GET --silent --show-error --fail \\
              --connect-timeout 12 --max-time 40 \\
              --output "${RUNNER_TEMP}/m3-availability-health.json" \\
              --write-out '%{http_code}|%{remote_ip}|%{time_namelookup}|%{time_connect}|%{time_appconnect}|%{time_starttransfer}|%{time_total}' \\
              "$API/api/v1/health")" || rc=$?
            IFS='|' read -r http ip dns tcp tls first_byte total <<< "$timings"
            printf 'AVAILABILITY_DIAG attempt=%s curl_exit=%s http=%s ip=%s dns_s=%s tcp_s=%s tls_s=%s first_byte_s=%s total_s=%s\\n' \\
              "$attempt" "$rc" "$http" "$ip" "$dns" "$tcp" "$tls" "$first_byte" "$total"
            if [ "$rc" -eq 0 ] && [ "$http" = 200 ]; then
              python3 - <<'PYHEALTH'
          import json, os
          from pathlib import Path
          health = json.loads((Path(os.environ['RUNNER_TEMP']) / 'm3-availability-health.json').read_text())
          assert health.get('project') == 'M3 NVOCC ERP'
          assert health.get('sandbox_only') is True
          assert health.get('production_promoted') is False
          print('ISOLATED_AVAILABILITY_PASS')
          PYHEALTH
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo 'ISOLATED_AVAILABILITY_FAIL: HTTP health unavailable; application smoke not run' >&2
          exit 1
  isolated-public-smoke:
    needs: isolated-api-availability
    # Never execute against preview-pr124 or production.
    if: github.head_ref == 'm3-dev-sprint-2' || github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe isolated public health readiness and UAT page without credentials
        env:
          API: https://m3-dev-sprint2-isolated-api.onrender.com
          UI: https://m3-dev-sprint2-isolated-ui.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/m3-isolated-http"
          mkdir -p "$OUT"
          # No UAT token or IAM session is supplied. Only GET calls are allowed.
          # DNS is diagnostic only: failed resolution is reported, not bypassed.
          python3 - <<'PYDNS'
          import socket
          for host in ("m3-dev-sprint2-isolated-api.onrender.com",
                       "m3-dev-sprint2-isolated-ui.onrender.com"):
              try:
                  addresses = sorted({x[4][0] for x in socket.getaddrinfo(
                      host, 443, type=socket.SOCK_STREAM)})
                  print(f"DNS_DIAG host={host} status=PASS addresses={','.join(addresses)}")
              except OSError as exc:
                  print(f"DNS_DIAG host={host} status=FAIL reason={type(exc).__name__}")
          PYDNS
          # Preserve the original 9 attempts, 4-second spacing and 40-second
          # per-attempt limit, but log each attempt instead of only the last.
          fetch() {
            local url="$1" target="$2" label="$3"
            local first_ms attempt done_ms rc metrics
            local http remote_ip dns_s tcp_s tls_s first_byte_s total_s
            first_ms="$(date +%s%3N)"
            for attempt in {1..9}; do
              rc=0
              metrics="$(curl --request GET --fail --silent --show-error \
                --connect-timeout 12 --max-time 40 \
                --write-out '%{http_code}|%{remote_ip}|%{time_namelookup}|%{time_connect}|%{time_appconnect}|%{time_starttransfer}|%{time_total}' \
                --output "$target" "$url")" || rc=$?
              done_ms="$(date +%s%3N)"
              IFS='|' read -r http remote_ip dns_s tcp_s tls_s first_byte_s total_s <<< "$metrics"
              printf 'HTTP_DIAG target=%s attempt=%s curl_exit=%s http=%s remote_ip=%s dns_s=%s tcp_s=%s tls_s=%s first_byte_s=%s total_s=%s elapsed_since_first_get_ms=%s\n' \
                "$label" "$attempt" "$rc" "$http" "$remote_ip" "$dns_s" "$tcp_s" "$tls_s" "$first_byte_s" "$total_s" "$((done_ms - first_ms))"
              if [ "$rc" -eq 0 ]; then
                if [ "$label" = "health" ]; then
                  printf 'COLD_START_DIAG health_first_success_elapsed_ms=%s\n' "$((done_ms - first_ms))"
                fi
                return 0
              fi
              if [ "$attempt" -lt 9 ]; then sleep 4; fi
            done
            if [ "$label" = "health" ]; then
              printf 'COLD_START_DIAG health_no_success_elapsed_ms=%s\n' "$((done_ms - first_ms))"
            fi
            return "$rc"
          }
          fetch "$API/api/v1/health" "$OUT/health.json" health
          fetch "$API/api/clx016/readiness" "$OUT/readiness.json" readiness
          fetch "$API/api/admin/auth/uat-masterdata-approval-page" "$OUT/uat.html" uat_page
          fetch "$UI/" "$OUT/frontend.html" frontend
          # Unauthenticated root must stay locked; do not disable traffic controls.
          root_rc=0
          root_metrics="$(curl --request GET --silent --show-error --output "$OUT/root.json" \
            --write-out '%{http_code}|%{remote_ip}|%{time_namelookup}|%{time_connect}|%{time_appconnect}|%{time_starttransfer}|%{time_total}' \
            --connect-timeout 12 --max-time 40 "$API/")" || root_rc=$?
          IFS='|' read -r root_status root_ip root_dns root_tcp root_tls root_first root_total <<< "$root_metrics"
          printf 'HTTP_DIAG target=locked_root curl_exit=%s http=%s remote_ip=%s dns_s=%s tcp_s=%s tls_s=%s first_byte_s=%s total_s=%s\n' \
            "$root_rc" "$root_status" "$root_ip" "$root_dns" "$root_tcp" "$root_tls" "$root_first" "$root_total"
          test "$root_rc" -eq 0
          test "$root_status" = "503"
          python - <<'PY'
          import json, os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "m3-isolated-http"
          health = json.loads((folder / "health.json").read_text())
          readiness = json.loads((folder / "readiness.json").read_text())
          root = json.loads((folder / "root.json").read_text())
          uat = (folder / "uat.html").read_text()
          frontend = (folder / "frontend.html").read_text()

          assert health.get("project") == "M3 NVOCC ERP", "Unexpected API target"
          assert health.get("sandbox_only") is True, "Not sandbox-only"
          assert health.get("production_promoted") is False, "Production target"
          assert health.get("database") == "postgres", "Database adapter mismatch"
          assert readiness.get("project") == "M3 NVOCC ERP", "Unexpected readiness target"
          assert readiness.get("database_health") == "ok", "Readiness DB probe failed"
          assert readiness.get("production_traffic") == "OFF", "Traffic lock not preserved"
          assert readiness.get("live_providers") == "OFF", "Live providers enabled"
          assert readiness.get("real_money") == "OFF", "Real-money flag enabled"
          assert root.get("detail", {}).get("code") == "PRODUCTION_TRAFFIC_LOCKED"
          assert "Isolated Master Data approval UAT" in uat, "UAT page not served"
          assert "<html" in frontend.lower(), "Frontend HTML not served"
          print("ISOLATED_HTTP_HEALTH_PASS")
          print("ISOLATED_HTTP_READINESS_DB_PASS")
          print("ISOLATED_UAT_PAGE_GET_PASS")
          print("ISOLATED_FRONTEND_GET_PASS")
          print("TRAFFIC_LOCK_PRESERVED")
          print("NO_CREDENTIALS_OR_MUTATIONS_USED")
          PY
