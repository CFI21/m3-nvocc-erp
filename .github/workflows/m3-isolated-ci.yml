name: M3 Isolated CI

on:
  push:
    branches:
      - preview-pr124-booking-isolated
      - m3-dev-sprint-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-isolated-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.head_ref == 'preview-pr124-booking-isolated' || github.ref_name == 'preview-pr124-booking-isolated' || github.head_ref == 'm3-dev-sprint-2' || github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
      DATABASE_URL: ""
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q app
      - name: Run regression tests
        id: pytest
        shell: bash
        run: |
          mkdir -p ci-proof
          set +e
          python -m pytest -q 2>&1 | tee ci-proof/pytest.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > ci-proof/pytest-exit-code.txt
          exit "$result"
      - name: Publish concise failure evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## M3 Pytest verification"
            if test -f ci-proof/pytest-exit-code.txt; then
              echo "Exit code: $(cat ci-proof/pytest-exit-code.txt)"
            else
              echo "Exit code: UNKNOWN"
            fi
            echo '~~~'
            if test -f ci-proof/pytest.log; then
              grep -E '^FAILED |^[0-9]+ failed|^[0-9]+ passed|^ERROR ' ci-proof/pytest.log | tail -n 80 || true
            else
              echo "pytest log unavailable"
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ci-proof/
          if-no-files-found: error
          retention-days: 7
  isolated-public-smoke:
    # Never execute against preview-pr124 or production.
    if: github.head_ref == 'm3-dev-sprint-2' || github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe isolated public health readiness and UAT page without credentials
        env:
          API: https://m3-dev-sprint2-isolated-api.onrender.com
          UI: https://m3-dev-sprint2-isolated-ui.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/m3-isolated-http"
          mkdir -p "$OUT"
          # No UAT token or IAM session is supplied. Only GET calls are allowed.
          fetch() {
            curl --fail --silent --show-error \
              --retry 8 --retry-delay 4 --retry-all-errors \
              --connect-timeout 12 --max-time 40 \
              --output "$2" "$1"
          }
          fetch "$API/api/v1/health" "$OUT/health.json"
          fetch "$API/api/clx016/readiness" "$OUT/readiness.json"
          fetch "$API/api/admin/auth/uat-masterdata-approval-page" "$OUT/uat.html"
          fetch "$UI/" "$OUT/frontend.html"
          # Unauthenticated root must stay locked; do not disable traffic controls.
          root_status="$(curl --silent --show-error --output "$OUT/root.json" \
            --write-out '%{http_code}' --connect-timeout 12 --max-time 40 "$API/")"
          test "$root_status" = "503"
          python - <<'PY'
          import json, os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "m3-isolated-http"
          health = json.loads((folder / "health.json").read_text())
          readiness = json.loads((folder / "readiness.json").read_text())
          root = json.loads((folder / "root.json").read_text())
          uat = (folder / "uat.html").read_text()
          frontend = (folder / "frontend.html").read_text()

          assert health.get("project") == "M3 NVOCC ERP", "Unexpected API target"
          assert health.get("sandbox_only") is True, "Not sandbox-only"
          assert health.get("production_promoted") is False, "Production target"
          assert health.get("database") == "postgres", "Database adapter mismatch"
          assert readiness.get("project") == "M3 NVOCC ERP", "Unexpected readiness target"
          assert readiness.get("database_health") == "ok", "Readiness DB probe failed"
          assert readiness.get("production_traffic") == "OFF", "Traffic lock not preserved"
          assert readiness.get("live_providers") == "OFF", "Live providers enabled"
          assert readiness.get("real_money") == "OFF", "Real-money flag enabled"
          assert root.get("detail", {}).get("code") == "PRODUCTION_TRAFFIC_LOCKED"
          assert "Isolated Master Data approval UAT" in uat, "UAT page not served"
          assert "<html" in frontend.lower(), "Frontend HTML not served"
          print("ISOLATED_HTTP_HEALTH_PASS")
          print("ISOLATED_HTTP_READINESS_DB_PASS")
          print("ISOLATED_UAT_PAGE_GET_PASS")
          print("ISOLATED_FRONTEND_GET_PASS")
          print("TRAFFIC_LOCK_PRESERVED")
          print("NO_CREDENTIALS_OR_MUTATIONS_USED")
          PY
