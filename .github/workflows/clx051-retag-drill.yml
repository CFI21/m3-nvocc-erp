name: CLX051 Rollback Retag Drill
on:
  push:
    branches: [clx051-rollback-drill]
    paths:
      - ".github/workflows/clx051-retag-drill.yml"
permissions:
  contents: read
  packages: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Restore CLX-051 immutable images to latest
        run: |
          docker buildx imagetools create --tag ghcr.io/cfi21/m3-nvocc-web:latest ghcr.io/cfi21/m3-nvocc-web@sha256:069beaca63368729f10a5ab5be57824963b40ff25331a8a4f8574cf9a59aa00b
          docker buildx imagetools create --tag ghcr.io/cfi21/m3-nvocc-api:latest ghcr.io/cfi21/m3-nvocc-api@sha256:bbc746f1317f5eec88addfb040acb94f2d7e33760c57dcd965cd3b013d050c31
