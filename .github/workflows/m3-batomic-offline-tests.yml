name: M3 B-Atomic Startup Gate Offline Tests
on:
  push:
    branches: [m3-batomic-startup-ci-20261103]
    paths:
      - "scripts/m3_batomic_startup_gate.py"
      - "tests/test_m3_batomic_startup_gate_offline.py"
      - ".github/workflows/m3-batomic-offline-tests.yml"
  pull_request:
    branches: [m3-dev-sprint-2]
    paths:
      - "scripts/m3_batomic_startup_gate.py"
      - "tests/test_m3_batomic_startup_gate_offline.py"
      - ".github/workflows/m3-batomic-offline-tests.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DATABASE_URL: ""
      M3_UAT_DB_HOST: ""
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'psycopg[binary]>=3.2,<4'
      - run: python -m py_compile scripts/m3_batomic_startup_gate.py tests/test_m3_batomic_startup_gate_offline.py
      - name: Safe offline validation only
        run: python -m pytest -q tests/test_m3_batomic_startup_gate_offline.py
