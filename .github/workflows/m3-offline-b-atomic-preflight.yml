name: M3 Offline B-Atomic Preflight Tests
on:
  push:
    branches: [m3-offline-preflight-20261102]
    paths:
      - "scripts/m3_b_atomic_offline_preflight.py"
      - "tests/test_m3_b_atomic_offline_preflight.py"
      - ".github/workflows/m3-offline-b-atomic-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ""
      M3_UAT_DB_HOST: ""
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m py_compile scripts/m3_b_atomic_offline_preflight.py tests/test_m3_b_atomic_offline_preflight.py
      - name: Offline regression
        run: python -m pytest -q tests/test_m3_b_atomic_offline_preflight.py
      - name: Confirm no unapproved operations
        run: echo "No database, Render, IAM or Neon operations performed."
