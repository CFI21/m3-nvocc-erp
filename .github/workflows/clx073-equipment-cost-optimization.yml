name: CLX-073 Equipment Cost Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx073_equipment_optimization.py"
      - "app/main.py"
      - "web/index.html"
      - "migrations/CLX073_001_equipment_cost_optimization.sql"
      - "CLX073_ACCEPTANCE_MANIFEST.json"
      - "CLX073_EQUIPMENT_COST_OPTIMIZATION_SOP.md"
      - "tests/test_clx073_equipment_optimization.py"
      - ".github/workflows/clx073-equipment-cost-optimization.yml"
  push:
    branches: [main]
    paths:
      - "app/clx073_equipment_optimization.py"
      - "app/main.py"
      - "web/index.html"
      - "migrations/CLX073_001_equipment_cost_optimization.sql"
      - "tests/test_clx073_equipment_optimization.py"
      - ".github/workflows/clx073-equipment-cost-optimization.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and targeted UAT
        env: {PYTHONPATH: .}
        run: |
          python -m py_compile app/*.py
          pytest -q tests/test_clx073_equipment_cost_optimization.py tests/test_clx072_equipment_network.py tests/test_clx071_container_journey.py tests/test_clx070_final_container_master.py tests/test_clx070_equipment_runtime.py tests/test_clx049_booking_bl_workspace.py tests/test_clx050_operational_uat.py
      - name: Architecture and production safety
        run: |
          grep -q '"production_traffic": "OFF"' CLX073_ACCEPTANCE_MANIFEST.json
          grep -q '"duplicate_rate_model": false' CLX073_ACCEPTANCE_MANIFEST.json
          grep -q '"duplicate_container_inventory": false' CLX073_ACCEPTANCE_MANIFEST.json
          ! grep -q "CREATE TABLE IF NOT EXISTS public.containers" migrations/CLX073_001_equipment_cost_optimization.sql
          ! grep -q "CREATE TABLE IF NOT EXISTS public.equipment_work_items" migrations/CLX073_001_equipment_cost_optimization.sql
          grep -q "Cost Optimization" web/index.html
