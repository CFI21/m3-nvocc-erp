name: M3 Disposable PostgreSQL Recovery Model CI
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m3-recovery-disposable-pg.yml"
      - "tests/test_pg_recovery_isolated_hardened.py"
permissions:
  contents: read
concurrency:
  group: m3-recovery-pg-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  recovery-postgres:
    if: github.repository == 'CFI21/m3-nvocc-erp' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M3_PRODUCTION_TRAFFIC: 'OFF'
      M3_LIVE_PROVIDERS: 'OFF'
      M3_REAL_MONEY: 'OFF'
      M3_DISPOSABLE_PG_DSN: postgresql://m3_disposable_runner:disposable_only@127.0.0.1:5432/m3_disposable_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m3_disposable_runner
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: m3_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3_disposable_runner -d m3_disposable_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check harness syntax
        run: python -m py_compile tests/test_pg_recovery_isolated_hardened.py
      - name: Run isolated PostgreSQL transaction-model tests
        run: python -m unittest discover -v -s tests -p 'test_pg_recovery_isolated_hardened.py'
