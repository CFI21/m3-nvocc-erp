name: M3 isolated authenticated bulk UAT

on:
  workflow_dispatch:
    inputs:
      submit_disposable:
        description: "Submit two disposable M3-only records (false = read-only authentication)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: m3-isolated-authenticated-uat
  cancel-in-progress: false

jobs:
  dispatch-isolated-auth-only:
    name: Forward main launch to isolated development branch
    if: github.ref_name == 'main' && inputs.submit_disposable == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch authentication-only UAT on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run m3-isolated-authenticated-uat.yml --ref m3-dev-sprint-2 -f submit_disposable=false
          echo 'Dispatched authentication-only M3 UAT on m3-dev-sprint-2. Inspect its separate run for the actual result.'
  reject-main-bulk:
    name: Prevent bulk execution from main
    if: github.ref_name == 'main' && inputs.submit_disposable == true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Bulk UAT must be explicitly launched on m3-dev-sprint-2, never from main.'
          exit 1
  isolated-uat:
    name: Authenticated M3-only acceptance gate
    if: github.ref_name == 'm3-dev-sprint-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m3-isolated-uat
    steps:
      - name: Verify branch isolation and secret availability
        env:
          M3_UAT_TOKEN: ${{ secrets.M3_UAT_TOKEN }}
          M3_MAKER_PASSWORD: ${{ secrets.M3_MAKER_PASSWORD }}
          M3_MAKER_MFA: ${{ secrets.M3_MAKER_MFA }}
          M3_CHECKER_PASSWORD: ${{ secrets.M3_CHECKER_PASSWORD }}
          M3_CHECKER_MFA: ${{ secrets.M3_CHECKER_MFA }}
        run: |
          if [ "$GITHUB_REF_NAME" != "m3-dev-sprint-2" ]; then
            echo "::error::Ref is not the M3 isolated development branch"
            exit 1
          fi
          for name in M3_UAT_TOKEN M3_MAKER_PASSWORD M3_MAKER_MFA M3_CHECKER_PASSWORD M3_CHECKER_MFA; do
            if [ -z "${!name}" ]; then
              echo "::error::Required M3 isolated UAT secret is not configured: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticated isolated UAT
        env:
          M3_UAT_TOKEN: ${{ secrets.M3_UAT_TOKEN }}
          M3_MAKER_PASSWORD: ${{ secrets.M3_MAKER_PASSWORD }}
          M3_MAKER_MFA: ${{ secrets.M3_MAKER_MFA }}
          M3_CHECKER_PASSWORD: ${{ secrets.M3_CHECKER_PASSWORD }}
          M3_CHECKER_MFA: ${{ secrets.M3_CHECKER_MFA }}
          SUBMIT_DISPOSABLE: ${{ inputs.submit_disposable }}
        run: |
          set -euo pipefail
          if [ "$SUBMIT_DISPOSABLE" = "true" ]; then
            python scripts/m3_isolated_atomic_bulk_uat.py --submit
          else
            python scripts/m3_isolated_atomic_bulk_uat.py
          fi
