name: M3 isolated authenticated bulk UAT

on:
  workflow_dispatch:
    inputs:
      submit_disposable:
        description: "Submit two disposable M3-only records (false = read-only authentication)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m3-isolated-authenticated-uat
  cancel-in-progress: false

jobs:
  isolated-uat:
    name: Authenticated M3-only acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: m3-isolated-uat
    steps:
      - name: Verify branch isolation and secret availability
        env:
          M3_UAT_TOKEN: ${{ secrets.M3_UAT_TOKEN }}
          M3_MAKER_PASSWORD: ${{ secrets.M3_MAKER_PASSWORD }}
          M3_MAKER_MFA: ${{ secrets.M3_MAKER_MFA }}
          M3_CHECKER_PASSWORD: ${{ secrets.M3_CHECKER_PASSWORD }}
          M3_CHECKER_MFA: ${{ secrets.M3_CHECKER_MFA }}
        run: |
          if [ "$GITHUB_REF_NAME" != "m3-dev-sprint-2" ]; then
            echo "::error::Ref is not the M3 isolated development branch"
            exit 1
          fi
          for name in M3_UAT_TOKEN M3_MAKER_PASSWORD M3_MAKER_MFA M3_CHECKER_PASSWORD M3_CHECKER_MFA; do
            if [ -z "${!name}" ]; then
              echo "::error::Required M3 isolated UAT secret is not configured: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated credential safety tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_m3_uat_token_safety.py
      - name: Secret-safe Maker credential diagnostics
        env:
          M3_MAKER_PASSWORD: ${{ secrets.M3_MAKER_PASSWORD }}
          M3_MAKER_MFA: ${{ secrets.M3_MAKER_MFA }}
        run: |
          python - <<'PY'
          import os
          password = os.environ.get("M3_MAKER_PASSWORD", "")
          mfa = os.environ.get("M3_MAKER_MFA", "")
          # Never print credentials, hashes, fingerprints or lengths.
          assert password, "M3 Maker password secret is missing"
          assert mfa, "M3 Maker MFA secret is missing"
          assert not any(ord(c) < 32 or ord(c) == 127 for c in password), "Maker password has a control character"
          assert not any(ord(c) < 32 or ord(c) == 127 for c in mfa), "Maker MFA has a control character"
          print("PASS: Maker credential inputs present; no control characters; password and MFA kept separate")
          print("NOTE: GitHub does not disclose which secret scope supplied a resolved secret; inspect environment and repository settings separately.")
          PY
      - name: Authenticated isolated UAT
        env:
          M3_UAT_TOKEN: ${{ secrets.M3_UAT_TOKEN }}
          M3_MAKER_PASSWORD: ${{ secrets.M3_MAKER_PASSWORD }}
          M3_MAKER_MFA: ${{ secrets.M3_MAKER_MFA }}
          M3_CHECKER_PASSWORD: ${{ secrets.M3_CHECKER_PASSWORD }}
          M3_CHECKER_MFA: ${{ secrets.M3_CHECKER_MFA }}
          SUBMIT_DISPOSABLE: ${{ inputs.submit_disposable }}
        run: |
          set -euo pipefail
          if [ "$SUBMIT_DISPOSABLE" = "true" ]; then
            python scripts/m3_isolated_atomic_bulk_uat.py --submit
          else
            python scripts/m3_isolated_atomic_bulk_uat.py
          fi
