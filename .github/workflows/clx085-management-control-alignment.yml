name: CLX-085 Management Control Alignment

on:
  push:
    branches: [clx085-management-control-alignment]
  workflow_dispatch:

jobs:
  clx085:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - name: Python compile
        run: python -m py_compile app/*.py
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('web/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',h,re.S)
          for i,b in enumerate(blocks): Path(f'/tmp/clx085_{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/clx085_*.js; do node --check "$f"; done
      - name: CLX-085 focused management tests
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_clx085_management_control_alignment.py tests/test_clx039_executive_home.py tests/test_clx028_management_kpi.py tests/test_clx027_control_tower.py tests/test_clx026_exception_workflow.py tests/test_clx025_operations_workbench.py tests/test_clx034_smart_approval_fast_track.py tests/test_clx084_finance_master_alignment.py tests/test_clx079_equipment_tower_ui.py tests/test_clx077_live_dummy_bank.py
      - name: Canonical 196-screen contract
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          from app.screen_catalog import build_catalog
          c=build_catalog()
          assert c['screen_count']==196
          assert [x['domain'] for x in c['menu']]==['HO Tasks','Agent Tasks','Treasury / AR-AP','Integration & Security','General / Administration','Master Data']
          ids=[x['screen_id'] for x in c['screens']]
          assert len(ids)==len(set(ids))
          print('CLX085_196_SCREEN_PASS')
          PY
      - name: Complete ERP regression
        env: {PYTHONPATH: .}
        run: pytest -q
      - name: Safety assertions
        run: |
          grep -q '"REAL_MONEY_READY": false' CLX085_UI_ACCEPTANCE.json
          grep -q '"REAL_PROVIDER_READY": false' CLX085_UI_ACCEPTANCE.json
          grep -q '"backend_model_changed": false' CLX085_UI_ACCEPTANCE.json
          grep -q '"database_changed": false' CLX085_UI_ACCEPTANCE.json
          grep -q '"new_kpi_ledger_created": false' CLX085_KPI_SOURCE_MATRIX.json
          grep -q '"new_exception_model_created": false' CLX085_KPI_SOURCE_MATRIX.json
          echo CLX085_SAFETY_PASS
