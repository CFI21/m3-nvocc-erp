name: M3 Agent Master Acceptance
on:
  push:
    branches: [preview-pr124-booking-isolated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-master-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M3_PRODUCTION_TRAFFIC: "OFF"
      M3_BULK_PERMISSION_GOVERNANCE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Agent Master approval and persistence
        run: python -m pytest -q tests/test_clx048_admin_masterdata.py -k "agent_master_create_update_four_eyes_and_readback"
      - name: Agent Master regression coverage
        run: python -m pytest -q tests/test_final_fix_validation_cycle.py -k "agent or booking_port"
