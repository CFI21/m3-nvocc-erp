name: M3 Agent Master Acceptance
on:
  push:
    branches: [preview-pr124-booking-isolated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-master-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      M3_PRODUCTION_TRAFFIC: "OFF"
      M3_BULK_PERMISSION_GOVERNANCE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Agent Master governance, approval and persistence
        run: python -m pytest -q tests/test_clx048_admin_masterdata.py
      - name: Agent Master six-tab UI contract
        run: python -m pytest -q tests/test_agent_master_ui_contract.py
      - name: Agent Master regression coverage
        run: python -m pytest -q tests/test_final_fix_validation_cycle.py -k "agent or booking_port"
