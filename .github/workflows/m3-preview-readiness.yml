name: M3 isolated preview readiness gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test readiness validation
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_m3_preview_readiness.py
      - name: Probe isolated Render UI, API and approved database readiness
        run: python scripts/m3_preview_readiness.py
