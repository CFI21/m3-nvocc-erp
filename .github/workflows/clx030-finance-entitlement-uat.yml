name: M3 CLX030 Finance Entitlement UAT
on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx030_finance_entitlements.py"
      - "app/admin.py"
      - "app/admin_seed.py"
      - "app/gl.py"
      - "app/main.py"
      - "app/static/M3_NVOCC_ERP_CLX-030_FINANCE_ENTITLEMENTS_20260926.html"
      - "web/index.html"
      - "tests/test_clx030_finance_entitlements.py"
      - ".github/workflows/clx030-finance-entitlement-uat.yml"
  workflow_dispatch:

jobs:
  finance-entitlement-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-030 finance entitlement tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx030_finance_entitlements.py
      - name: Preserve frozen accounting/navigation and 193-screen baseline
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx029_accounting_navigation_access.py
          tests/test_clx019_catalog_roles.py
          tests/test_clx025_operations_workbench.py
          tests/test_clx026_exception_workflow.py
          tests/test_clx027_control_tower.py
          tests/test_clx028_management_kpi.py
          tests/test_live_provider_runtime.py
