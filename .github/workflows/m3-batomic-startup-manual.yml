name: M3 B-Atomic Manual Startup Gate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-batomic-disposable-startup
  cancel-in-progress: false

jobs:
  pinned-startup-only:
    if: github.repository == 'CFI21/m3-nvocc-erp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: m3-batomic-disposable
    env:
      M3_PINNED_REPO: m3-pinned
      M3_UAT_DB_HOST: ep-quiet-breeze-b43xue0h.c-6.us-east-2.aws.neon.tech
      M3_UAT_PRESERVE_DATA: '1'
      M3_PRODUCTION_TRAFFIC: 'OFF'
      M3_LIVE_PROVIDERS: 'OFF'
      M3_REAL_MONEY: 'OFF'
    steps:
      - name: Checkout reviewed, pinned startup harness
        uses: actions/checkout@v4
        with:
          ref: f9957319fcbe6e244d166dd063dcd931987cf0e7
          path: harness
          persist-credentials: false
      - name: Checkout approved immutable application revision
        uses: actions/checkout@v4
        with:
          ref: 79968230bd5601142d9239c739853b64ed9d2f82
          path: m3-pinned
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolated secret target, do not expose the URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.M3_BATOMIC_DIRECT_DATABASE_URL }}
        run: |
          set +x
          python - <<'PY'
          import os,sys
          from urllib.parse import urlsplit,parse_qs
          u=os.environ.get("DATABASE_URL","")
          if not u:
              sys.exit("DIRECT_DATABASE_SECRET_MISSING")
          try:
              p=urlsplit(u)
              valid=(p.scheme in ("postgres","postgresql")
                     and p.hostname == os.environ["M3_UAT_DB_HOST"]
                     and p.path == "/neondb"
                     and parse_qs(p.query).get("sslmode") == ["require"]
                     and "-pooler" not in (p.hostname or "")
                     and "pgbouncer" not in p.query.lower())
          except (ValueError,KeyError):
              valid=False
          if not valid:
              sys.exit("DIRECT_DATABASE_TARGET_GUARD_FAIL")
          print("DIRECT_DATABASE_SECRET_AND_HOST_PASS")
          PY
      - name: Install pinned app dependencies without DB secrets
        run: python -m pip install -r m3-pinned/requirements.txt
      - name: Validate reviewed startup test syntax without secrets
        run: python -m py_compile harness/scripts/m3_batomic_startup_gate.py
      - name: Verify pinned app allows exactly this target
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.M3_BATOMIC_DIRECT_DATABASE_URL }}
        run: |
          set +x
          cd m3-pinned
          python -c "from app.db import assert_approved_database_target; assert_approved_database_target(); print('APP_DATABASE_TARGET_GUARD_PASS')"
      - name: Run startup-only zero-write test (no login or submission)
        env:
          DATABASE_URL: ${{ secrets.M3_BATOMIC_DIRECT_DATABASE_URL }}
        run: python harness/scripts/m3_batomic_startup_gate.py
