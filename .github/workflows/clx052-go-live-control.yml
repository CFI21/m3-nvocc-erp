name: M3 CLX052 Go-Live Control
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  clx052-go-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Lightweight compile
        run: python -m py_compile app/*.py
      - name: CLX-052 cutover/go-live control gates
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx052_go_live_control.py
      - name: CLX-051 + CLX-050 inherited operational gates
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx051_production_readiness.py tests/test_clx050_operational_uat.py tests/test_build_first_fast_track.py
