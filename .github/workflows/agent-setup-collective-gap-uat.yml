name: M3 Agent Setup Collective Gap UAT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-setup-collective-gap-uat.yml'

jobs:
  agent-setup-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_agent_setup_collective_gap.py
      - name: Live endpoints and UI
        shell: bash
        run: |
          set -euo pipefail
          API="https://m3-nvocc-api-latest-1.onrender.com"
          WEB="https://m3-nvocc-web-latest.onrender.com"
          curl --fail --silent --show-error -H 'X-Role: AUDITOR' "$API/api/agent-setup/relations" -o /tmp/relations.json
          curl --fail --silent --show-error -H 'X-Role: AUDITOR' "$API/api/agent-setup/volume-restrictions" -o /tmp/volume.json
          curl --fail --silent --show-error -H 'X-Role: AUDITOR' "$API/api/agent-setup/network" -o /tmp/network.json
          curl --fail --silent --show-error -H 'X-Role: AUDITOR' "$API/api/agent-setup/booking/50004/eligibility" -o /tmp/eligibility.json
          curl --fail --silent --show-error -H 'X-Role: AUDITOR' "$API/api/clx011/menu" -o /tmp/menu.json
          curl --fail --silent --show-error "$WEB/" -o /tmp/index.html
          python - <<'PY'
          import json
          html=open('/tmp/index.html',encoding='utf-8').read()
          rel=json.load(open('/tmp/relations.json'))
          vol=json.load(open('/tmp/volume.json'))
          net=json.load(open('/tmp/network.json'))
          elig=json.load(open('/tmp/eligibility.json'))
          menu=json.load(open('/tmp/menu.json'))
          assert rel['new_agent_model'] is False
          assert vol['server_side_enforcement'] is True
          assert set(vol['limit_types'])=={'BOOKING_COUNT','CONTAINER_COUNT','TEU'}
          assert net['equipment_network_changed'] is False
          assert 'eligible' in elig
          assert menu['screen_count']==196
          for x in ['Agent Relation','Agent Volume Restriction','Agent Network','Equipment Network remains separate and unchanged']:
              assert x in html,x
          print('AGENT_RELATION=PASS')
          print('AGENT_VOLUME_RESTRICTION=PASS')
          print('AGENT_NETWORK=PASS')
          print('SERVER_SIDE_ENFORCEMENT=PASS')
          print('BOOKING_AGENT_RESOLUTION=PASS')
          print('SCREEN_COUNT=196')
          print('ANCLINE_TOUCHED=FALSE')
          PY
