name: M3 B01 Countries isolated validation
on:
  push:
    branches: [preview-pr124-booking-isolated]
    paths:
      - 'app/masterdata.py'
      - 'web/index.html'
      - 'tests/test_b01_agent_countries_iam_resolution.py'
      - '.github/workflows/m3-b01-countries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b01-countries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_b01_agent_countries_iam_resolution.py
      - run: python -m compileall -q app
      - name: Preserve six tab and scoped resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path('web/index.html').read_text()
          api=Path('app/masterdata.py').read_text()
          assert "['Agent Detail','Emails','Countries','Offices','CRO Detail','B/L Template']" in ui
          assert "api('/api/masterdata/agent-office-countries')" in ui
          assert 'def agent_office_countries(' in api
          PY
