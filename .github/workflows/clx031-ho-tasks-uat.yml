name: M3 CLX031 HO Tasks Restore UAT
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clx031-ho-tasks-uat.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-031 HO navigation tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx031_ho_tasks_navigation.py
      - name: Full frozen catalog and control regression
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx019_catalog_roles.py
          tests/test_clx025_operations_workbench.py
          tests/test_clx026_exception_workflow.py
          tests/test_clx027_control_tower.py
          tests/test_clx028_management_kpi.py
          tests/test_clx029_accounting_navigation_access.py
          tests/test_clx030_finance_entitlements.py
          tests/test_live_provider_runtime.py
