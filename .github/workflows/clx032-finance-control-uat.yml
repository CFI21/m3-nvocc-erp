name: M3 CLX032 Finance Control UAT
on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx032_finance_controls.py"
      - "app/admin_seed.py"
      - "app/main.py"
      - "app/static/M3_NVOCC_ERP_CLX-032_FINANCE_CONTROLS_20260926.html"
      - "web/index.html"
      - "tests/test_clx032_finance_controls.py"
      - ".github/workflows/clx032-finance-control-uat.yml"
  workflow_dispatch:

jobs:
  finance-control-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-032 approval delegation SoD tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx032_finance_controls.py
      - name: Preserve CLX-030 through CLX-019 governed baseline
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx031_ho_tasks_navigation.py
          tests/test_clx030_finance_entitlements.py
          tests/test_clx029_accounting_navigation_access.py
          tests/test_clx019_catalog_roles.py
          tests/test_clx025_operations_workbench.py
          tests/test_clx026_exception_workflow.py
          tests/test_clx027_control_tower.py
          tests/test_clx028_management_kpi.py
          tests/test_live_provider_runtime.py
