name: M3 CRT Governance and TRT Rename

on:
  pull_request:
    paths:
      - "app/crt_governance.py"
      - "app/main.py"
      - "app/module_meta.json"
      - "app/screen_catalog.py"
      - "app/screen_integration.py"
      - "app/screen_integration_meta.json"
      - "app/seed.py"
      - "app/seed.json"
      - "app/schema.sql"
      - "web/index.html"
      - "migrations/M3_CRT_GOVERNANCE_TRT_RENAME_001.sql"
      - "docs/M3_CRT_GOVERNANCE_FROZEN_AMENDMENT.md"
      - "tests/test_m3_crt_governance_trt_rename.py"
      - ".github/workflows/m3-crt-governance-trt-rename.yml"

permissions:
  contents: read

jobs:
  crt-trt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: CRT governance + TRT naming tests
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_m3_crt_governance_trt_rename.py
      - name: Item 2 regression
        env:
          PYTHONPATH: .
          M3_JOB_IDEMPOTENCY_ENABLED: "true"
          M3_JOB_MODES_ENABLED: "true"
        run: pytest -q tests/test_m3_item2_job_modes.py
      - name: Item 1 regression
        env:
          PYTHONPATH: .
          M3_JOB_IDEMPOTENCY_ENABLED: "true"
        run: pytest -q tests/test_m3_item1_job_idempotency.py
      - name: Stage 0 regression
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_m3_stage0_baseline_freeze.py
      - name: Full M3 regression
        env: {PYTHONPATH: .}
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
