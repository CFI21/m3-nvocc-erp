name: CLX022 Development Guard

on:
  push:
    branches:
      - "develop/**"
  workflow_dispatch:

jobs:
  validate-development-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile and regression test
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/*.py
          pytest -q tests/test_clx016_postgres_adapter.py tests/test_clx019_catalog_roles.py

      - name: Enforce production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" != "main"
          test "$GITHUB_REF_NAME" != "release/clx021-final-20260925"
          grep -q 'AUTONOMOUS_DEVELOPMENT_BASELINE' CLX022_DEVELOPMENT_BASELINE.json
          grep -q '"promotion": "MANUAL_CONTROLLED_ONLY"' CLX022_DEVELOPMENT_BASELINE.json
          grep -q '"live_providers": "OFF"' CLX022_DEVELOPMENT_BASELINE.json
          grep -q '"real_money": "OFF"' CLX022_DEVELOPMENT_BASELINE.json
          grep -q '"ancline": "DO_NOT_TOUCH"' CLX022_DEVELOPMENT_BASELINE.json

      - name: Verify image publishing remains main-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in [Path('.github/workflows/m3-ghcr-image.yml'), Path('.github/workflows/m3-ghcr-web.yml')]:
              s=p.read_text()
              assert 'branches: [main]' in s, p
          print('DEVELOPMENT_IMAGE_PUBLISH_GUARD_PASS')
          PY
