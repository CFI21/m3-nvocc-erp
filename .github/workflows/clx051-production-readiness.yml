name: M3 CLX051 Production Readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  clx051-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Lightweight compile
        run: python -m py_compile app/*.py
      - name: CLX-051 production-readiness gates
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx051_production_readiness.py
      - name: CLX-050 inherited role and business-day gates
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx050_operational_uat.py tests/test_build_first_fast_track.py
