name: M3 Build GHCR Web Image

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.web"
      - ".github/workflows/m3-ghcr-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web shell
        shell: bash
        run: |
          grep -q "M3_API_BASE=''" web/index.html
          grep -q "proxy_pass https://m3-nvocc-api-latest-1.onrender.com" web/nginx.conf
          grep -q "X-M3-UAT-Token" web/index.html
          grep -q "CLX-018" web/index.html
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/cfi21/m3-nvocc-web
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
