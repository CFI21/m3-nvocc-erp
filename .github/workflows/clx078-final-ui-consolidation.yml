name: CLX-078 Final UI Consolidation

on:
  push:
    branches: [clx078-final-ui-consolidation]
  workflow_dispatch:

jobs:
  clx078:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - name: Python compile
        run: python -m py_compile app/*.py
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('web/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',h,re.S)
          for i,b in enumerate(blocks):
              Path(f'/tmp/clx078_{i}.js').write_text(b,encoding='utf-8')
          print('script_blocks',len(blocks))
          PY
          for f in /tmp/clx078_*.js; do node --check "$f"; done
      - name: CLX-078 targeted UI tests
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_clx078_ui_consolidation.py tests/test_clx049_booking_bl_workspace.py tests/test_clx070_final_container_master.py tests/test_clx070_equipment_runtime.py tests/test_clx071_container_journey.py tests/test_clx072_equipment_network.py tests/test_clx073_equipment_cost_optimization.py tests/test_clx074_depot_mr.py tests/test_clx075_final_bulk.py tests/test_clx077_live_dummy_bank.py
      - name: Canonical 196-screen contract
        env: {PYTHONPATH: .}
        run: |
          python - <<'PY'
          from app.screen_catalog import build_catalog
          c=build_catalog()
          assert len(c['screens'])==196, len(c['screens'])
          assert [x['domain'] for x in c['menu']]==['Agent Tasks','HO Tasks','Treasury / AR-AP','Integration & Security','General / Administration','Master Data'] or [x['domain'] for x in c['menu']]==['HO Tasks','Agent Tasks','Treasury / AR-AP','Integration & Security','General / Administration','Master Data']
          ids=[x['screen_id'] for x in c['screens']]
          assert len(ids)==len(set(ids))
          print('CLX078_196_SCREEN_CONTRACT_PASS')
          PY
      - name: Complete ERP regression
        env: {PYTHONPATH: .}
        run: pytest -q
      - name: Safety assertions
        run: |
          grep -q '"REAL_MONEY_READY": false' CLX078_LIVE_UI_ACCEPTANCE.json
          grep -q '"REAL_PROVIDER_READY": false' CLX078_LIVE_UI_ACCEPTANCE.json
          grep -q 'No parallel charge model' web/index.html
          grep -q 'Global Equipment Tower' web/index.html
          echo CLX078_SAFETY_PASS
