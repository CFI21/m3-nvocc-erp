name: M3 CLX034 Smart Approval Fast Track UAT
on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx034_smart_approval_fast_track.py"
      - "app/clx033_finance_transaction_governance.py"
      - "app/gl.py"
      - "app/treasury.py"
      - "app/main.py"
      - "tests/test_clx034_smart_approval_fast_track.py"
      - ".github/workflows/clx034-smart-approval-fast-track-uat.yml"
  workflow_dispatch:

jobs:
  clx034-smart-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-034 smart approval fast track
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx034_smart_approval_fast_track.py
      - name: Preserve governed baseline
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx033_finance_transaction_governance.py
          tests/test_clx032_finance_controls.py
          tests/test_clx031_ho_tasks_navigation.py
          tests/test_clx030_finance_entitlements.py
          tests/test_clx029_accounting_navigation_access.py
          tests/test_clx025_operations_workbench.py
          tests/test_clx026_exception_workflow.py
          tests/test_clx027_control_tower.py
          tests/test_clx028_management_kpi.py
          tests/test_live_provider_runtime.py

# CLX-034 post-merge verification trigger
