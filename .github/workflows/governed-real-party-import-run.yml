name: M3 Governed Real Party Import Run
on:
  push:
    branches: [governed-real-party-import-run]
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/governed_real_party_import.py
