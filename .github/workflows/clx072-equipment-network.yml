name: CLX-072 Global Equipment Network

on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx072_equipment_network.py"
      - "app/main.py"
      - "web/index.html"
      - "migrations/CLX072_001_equipment_network.sql"
      - "CLX072_ACCEPTANCE_MANIFEST.json"
      - "CLX072_EQUIPMENT_NETWORK_SOP.md"
      - "tests/test_clx072_equipment_network.py"
      - ".github/workflows/clx072-equipment-network.yml"
  push:
    branches: [main]
    paths:
      - "app/clx072_equipment_network.py"
      - "app/main.py"
      - "web/index.html"
      - "migrations/CLX072_001_equipment_network.sql"
      - "tests/test_clx072_equipment_network.py"
      - ".github/workflows/clx072-equipment-network.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and targeted UAT
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app/*.py
          pytest -q tests/test_clx072_equipment_network.py tests/test_clx071_container_journey.py tests/test_clx070_final_container_master.py tests/test_clx070_equipment_runtime.py tests/test_clx049_booking_bl_workspace.py tests/test_clx050_operational_uat.py
      - name: Architecture and production safety
        run: |
          grep -q '"production_traffic": "OFF"' CLX072_ACCEPTANCE_MANIFEST.json
          grep -q '"live_providers": "OFF"' CLX072_ACCEPTANCE_MANIFEST.json
          grep -q '"real_money": "OFF"' CLX072_ACCEPTANCE_MANIFEST.json
          grep -q '"duplicate_container_inventory": false' CLX072_ACCEPTANCE_MANIFEST.json
          grep -q "public.containers remains authoritative" migrations/CLX072_001_equipment_network.sql
          grep -q "Network Control" web/index.html
          ! grep -q "CREATE TABLE IF NOT EXISTS public.containers" migrations/CLX072_001_equipment_network.sql
