name: M3 B-Atomic Ephemeral PostgreSQL Transactions
on:
  push:
    branches: [m3-batomic-ephemeral-postgres-20261104]
    paths:
      - "tests/test_m3_batomic_ephemeral_postgres.py"
      - ".github/workflows/m3-batomic-ephemeral-postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/test_m3_batomic_ephemeral_postgres.py"
      - ".github/workflows/m3-batomic-ephemeral-postgres.yml"
permissions:
  contents: read
jobs:
  ephemeral-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m3test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: m3_atomic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3test -d m3_atomic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ""
      M3_EPHEMERAL_PG_DSN: "postgresql://m3test:ephemeral-ci-only@127.0.0.1:5432/m3_atomic_test"
      M3_PRODUCTION_TRAFFIC: "OFF"
      M3_LIVE_PROVIDERS: "OFF"
      M3_REAL_MONEY: "OFF"
      M3_MAKER_PASSWORD: ""
      M3_MAKER_MFA: ""
    steps:
      - name: Checkout offline tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable approved M3 application
        uses: actions/checkout@v4
        with:
          ref: 79968230bd5601142d9239c739853b64ed9d2f82
          path: m3-pinned
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ephemeral test dependencies
        run: python -m pip install pytest fastapi "pydantic>=2,<3" "psycopg[binary]" openpyxl
      - name: Python syntax check
        run: python -m py_compile tests/test_m3_batomic_ephemeral_postgres.py
      - name: Run actual PostgreSQL transaction and rollback tests (local service only)
        run: python -m pytest -q tests/test_m3_batomic_ephemeral_postgres.py
