name: M3 isolated credential regression tests

on:
  push:
    branches:
      - m3-dev-sprint-2
    paths:
      - 'scripts/m3_isolated_atomic_bulk_uat.py'
      - 'tests/test_m3_uat_token_safety.py'
      - '.github/workflows/m3-isolated-credential-tests.yml'
  pull_request:
    paths:
      - 'scripts/m3_isolated_atomic_bulk_uat.py'
      - 'tests/test_m3_uat_token_safety.py'
      - '.github/workflows/m3-isolated-credential-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-tests:
    if: github.ref_name == 'm3-dev-sprint-2' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline M3 credential regression tests
        run: python -m pytest -q tests/test_m3_uat_token_safety.py
