name: M3 CLX033 Finance Transaction Governance UAT
on:
  pull_request:
    branches: [main]
    paths:
      - "app/clx033_finance_transaction_governance.py"
      - "app/gl.py"
      - "app/treasury.py"
      - "app/admin_seed.py"
      - "app/main.py"
      - "app/static/M3_NVOCC_ERP_CLX-033_FINANCE_APPROVAL_WORKBENCH_20260926.html"
      - "web/index.html"
      - "tests/test_clx033_finance_transaction_governance.py"
      - ".github/workflows/clx033-finance-transaction-governance-uat.yml"
  workflow_dispatch:

jobs:
  finance-transaction-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile app/*.py
      - name: CLX-033 finance transaction governance
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_clx033_finance_transaction_governance.py
      - name: Preserve CLX-032 + CLX-031 + CLX-030 + governed baseline
        env:
          PYTHONPATH: .
        run: >
          pytest -q
          tests/test_clx032_finance_controls.py
          tests/test_clx031_ho_tasks_navigation.py
          tests/test_clx030_finance_entitlements.py
          tests/test_clx029_accounting_navigation_access.py
          tests/test_clx019_catalog_roles.py
          tests/test_clx025_operations_workbench.py
          tests/test_clx026_exception_workflow.py
          tests/test_clx027_control_tower.py
          tests/test_clx028_management_kpi.py
          tests/test_live_provider_runtime.py
