name: CLX052 Rollback Retag Drill
on:
  push:
    branches: [clx052-rollback-drill]
    paths:
      - ".github/workflows/clx052-retag-drill.yml"
permissions:
  contents: read
  packages: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Retag frozen CLX-050 rollback images to latest
        run: |
          docker buildx imagetools create --tag ghcr.io/cfi21/m3-nvocc-web:latest ghcr.io/cfi21/m3-nvocc-web@sha256:081bbee4a60f9b1e39b23153f0e517793ce0203dd4edb96a982d668231c2c4ee
          docker buildx imagetools create --tag ghcr.io/cfi21/m3-nvocc-api:latest ghcr.io/cfi21/m3-nvocc-api@sha256:fe00e3155ce75a44acc1a3cec879ac143cc158699b843123fb6c0a24aff77381
