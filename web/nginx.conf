server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"m3-nvocc-web-prod"}';
    }

    location /api/ {
        proxy_ssl_server_name on;
        proxy_ssl_name m3-nvocc-api-latest-1.onrender.com;
        proxy_set_header Host m3-nvocc-api-latest-1.onrender.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_pass https://m3-nvocc-api-latest-1.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
