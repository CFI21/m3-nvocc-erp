<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 CLX-032 Finance Controls</title><style>
body{font:13px Arial;margin:0;background:#f4f6f8;color:#1f2937}.top{padding:14px 18px;background:#fff;border-bottom:1px solid #d6dce4;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wrap{padding:16px}.card{background:#fff;border:1px solid #d6dce4;border-radius:8px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:7px;border-bottom:1px solid #e7ebf0;text-align:left}th{background:#eef2f5}input,select,button{padding:8px;border:1px solid #b8c2cf;border-radius:5px;background:#fff}button{cursor:pointer}.primary{background:#2f6b55;color:#fff}.muted{color:#667085}.bad{color:#b42318}.pill{padding:3px 8px;border-radius:12px;background:#e8f3ed;color:#2f6b55;font-weight:bold}</style></head><body>
<div class="top"><b>M3 NVOCC ERP · CLX-032</b><span class="pill">General / Administration → Finance Control Setup</span><span class="muted">Approval limits · Delegation · SoD · Four-eyes · No production promotion</span></div>
<div class="wrap">
<div class="card"><b>Admin session</b><div class="grid" style="margin-top:8px"><input id="username" value="admin"><input id="password" type="password" placeholder="Password"><input id="mfa" value="123456"><button class="primary" onclick="login()">Sign in</button></div><div id="sessionState" class="muted" style="margin-top:6px">Not signed in.</div></div>
<div class="card"><b>Approval limit request</b><div class="grid" style="margin-top:8px"><select id="subjectType"><option>ROLE</option><option>USER</option></select><input id="subjectCode" placeholder="Role code / username"><input id="currency" value="USD" maxlength="3"><input id="amount" type="number" value="10000"><select id="tx"><option>GL</option><option>JOURNAL</option><option>AR</option><option>AP</option><option>TREASURY</option></select><select id="act"><option>APPROVE</option><option>POST</option><option>RELEASE</option><option>PAY</option><option>WRITE_OFF</option><option>REVERSE</option><option>CLOSE</option></select><input id="level" type="number" min="1" max="9" value="1"><input id="office" placeholder="Office *"><input id="country" placeholder="Country *"><input id="from" placeholder="Effective from ISO"><input id="to" placeholder="Effective to ISO"><input id="limitReason" value="Approved finance authority"><button class="primary" onclick="requestLimit()">Submit for four-eyes approval</button></div></div>
<div class="card"><b>Temporary delegation request</b><div class="grid" style="margin-top:8px"><input id="fromUser" placeholder="From username"><input id="toUser" placeholder="To username"><select id="perm"></select><select id="delTx"><option value="">All finance transaction types</option><option>GL</option><option>JOURNAL</option><option>AR</option><option>AP</option><option>TREASURY</option></select><input id="delOffice" placeholder="Office *"><input id="delCountry" placeholder="Country *"><input id="delFrom" placeholder="Valid from ISO"><input id="delTo" placeholder="Valid to ISO"><input id="delReason" value="Temporary finance coverage"><button class="primary" onclick="requestDelegation()">Submit delegation</button></div></div>
<div class="card"><b>SoD conflict request</b><div class="grid" style="margin-top:8px"><input id="sodCode" placeholder="Conflict code"><input id="capA" placeholder="PERM:JOURNAL_CREATE"><input id="capB" placeholder="PERM:JOURNAL_APPROVE"><select id="severity"><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><input id="sodReason" value="Segregation of duties control"><button class="primary" onclick="requestSod()">Submit SoD rule</button></div></div>
<div class="card"><b>Approval evaluation / escalation</b><div class="grid" style="margin-top:8px"><input id="evalUser" placeholder="Username"><input id="evalAmount" type="number" value="25000"><input id="evalCurrency" value="USD"><select id="evalTx"><option>GL</option><option>JOURNAL</option><option>AR</option><option>AP</option><option>TREASURY</option></select><select id="evalAct"><option>APPROVE</option><option>POST</option><option>RELEASE</option><option>PAY</option></select><input id="evalOffice" placeholder="Office"><input id="evalCountry" placeholder="Country"><button onclick="evaluateLimit()">Evaluate</button></div><pre id="evalResult"></pre></div>
<div class="card"><div class="grid"><input id="q" placeholder="Search controls..." oninput="load()"><select id="status" onchange="load()"><option value="">All statuses</option><option>ACTIVE</option><option>PENDING</option><option>COMPLETED</option><option>INACTIVE</option><option>REVOKED</option></select><button onclick="load()">Refresh</button></div></div>
<div id="views"></div></div>
<script>
let token=localStorage.getItem('m3-clx032-session')||'';const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const perms=['GL_VIEW','GL_CREATE','GL_EDIT','GL_DISABLE','GL_POST','JOURNAL_CREATE','JOURNAL_APPROVE','ACCOUNT_MAPPING_MANAGE','COST_PROFIT_CENTER_MANAGE','TAX_CURRENCY_MANAGE','PERIOD_CLOSE','FINANCE_CONFIG_ADMIN'];$('perm').innerHTML=perms.map(x=>'<option>'+x+'</option>').join('');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers['X-M3-Session']=token;let r=await fetch(url,opt),d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw new Error(JSON.stringify(d.detail||d));return d}
async function login(){try{let d=await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,mfa_code:$('mfa').value})});token=d.session_token;localStorage.setItem('m3-clx032-session',token);$('sessionState').textContent='Signed in as '+d.username+' · '+d.roles.join(', ');await load()}catch(e){$('sessionState').innerHTML='<span class=bad>'+esc(e.message)+'</span>'}}
async function post(url,b){let d=await api(url,{method:'POST',body:JSON.stringify(b)});alert(d.status+(d.review_ref?' · '+d.review_ref:''));await load();return d}
async function requestLimit(){await post('/api/clx032/approval-limits',{subject_type:$('subjectType').value,subject_code:$('subjectCode').value,currency:$('currency').value,amount_limit:+$('amount').value,transaction_type:$('tx').value,action:$('act').value,level:+$('level').value,office_code:$('office').value||null,country_code:$('country').value||null,valid_from:$('from').value||null,valid_to:$('to').value||null,reason:$('limitReason').value})}
async function requestDelegation(){await post('/api/clx032/delegations',{from_username:$('fromUser').value,to_username:$('toUser').value,permission_code:$('perm').value,transaction_type:$('delTx').value||null,office_code:$('delOffice').value||null,country_code:$('delCountry').value||null,valid_from:$('delFrom').value,valid_to:$('delTo').value,reason:$('delReason').value})}
async function requestSod(){await post('/api/clx032/sod-conflicts',{conflict_code:$('sodCode').value,capability_a:$('capA').value,capability_b:$('capB').value,reason:$('sodReason').value,severity:$('severity').value})}
async function decide(ref,decision){await post('/api/clx032/reviews/'+encodeURIComponent(ref)+'/decision',{decision,comment:'CLX-032 finance control decision'})}
async function revoke(kind,ref){if(!confirm('Revoke '+ref+'?'))return;let u=kind==='limit'?'/api/clx032/approval-limits/'+ref+'/revoke':kind==='delegation'?'/api/clx032/delegations/'+encodeURIComponent(ref)+'/revoke':'/api/clx032/sod-conflicts/'+encodeURIComponent(ref)+'/revoke';await post(u,{})}
async function evaluateLimit(){try{$('evalResult').textContent=JSON.stringify(await api('/api/clx032/evaluate',{method:'POST',body:JSON.stringify({username:$('evalUser').value,currency:$('evalCurrency').value,amount:+$('evalAmount').value,transaction_type:$('evalTx').value,action:$('evalAct').value,office_code:$('evalOffice').value||null,country_code:$('evalCountry').value||null})}),null,2)}catch(e){$('evalResult').textContent=e.message}}
function table(title,rows,cols,actions){return '<div class=card><b>'+esc(title)+'</b><div class=table><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(actions?'<th>Actions</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])+'</td>').join('')+(actions?'<td>'+actions(r)+'</td>':'')+'</tr>').join('')+'</tbody></table></div></div>'}
async function load(){try{let d=await api('/api/clx032/workspace?q='+encodeURIComponent($('q').value)+'&status='+encodeURIComponent($('status').value));let h='';h+=table('Approval Limits',d.approval_limits,['id','role_code','currency','amount_limit','dimensions','status'],r=>r.status==='ACTIVE'?'<button onclick="revoke(\'limit\','+r.id+')">Revoke</button>':'');h+=table('Delegations',d.delegations,['delegation_ref','from_username','to_username','permission_code','valid_from','valid_to','status','approved_by'],r=>r.status==='ACTIVE'?'<button onclick="revoke(\'delegation\',\''+esc(r.delegation_ref)+'\')">Revoke</button>':'');h+=table('Segregation of Duties',d.sod_conflicts,['conflict_code','role_a','role_b','severity','reason','status'],r=>r.status==='ACTIVE'?'<button onclick="revoke(\'sod\',\''+esc(r.conflict_code)+'\')">Revoke</button>':'');h+=table('Four-eyes Review Queue',d.access_reviews,['review_ref','status','reviewer','due_date','result'],r=>r.status==='PENDING'?'<button onclick="decide(\''+esc(r.review_ref)+'\',\'APPROVE\')">Approve</button> <button onclick="decide(\''+esc(r.review_ref)+'\',\'REJECT\')">Reject</button>':'');h+=table('Immutable Finance Control Audit',d.audit,['ts','actor_user_ref','action','resource_type','resource_ref','before_json','after_json']);$('views').innerHTML=h}catch(e){$('views').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
