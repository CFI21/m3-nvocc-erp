<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 CLX-033 Finance Approval Workbench</title><style>
body{font:13px Arial;margin:0;background:#f4f6f8;color:#1f2937}.top{padding:14px 18px;background:#fff;border-bottom:1px solid #d6dce4;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wrap{padding:16px}.card{background:#fff;border:1px solid #d6dce4;border-radius:8px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}input,select,button{padding:8px;border:1px solid #b8c2cf;border-radius:5px;background:#fff}button{cursor:pointer}.primary{background:#2f6b55;color:#fff}.bad{color:#b42318}.muted{color:#667085}.pill{padding:3px 8px;border-radius:12px;background:#e8f3ed;color:#2f6b55;font-weight:bold}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1150px}th,td{padding:7px;border-bottom:1px solid #e7ebf0;text-align:left}th{background:#eef2f5}</style></head><body>
<div class="top"><b>M3 NVOCC ERP · CLX-033</b><span class="pill">Finance Transaction Approval Workbench</span><span class="muted">GL · Journal · AR · AP · Treasury · no live providers · no real money</span></div>
<div class="wrap">
<div class="card"><b>Finance session</b><div class="grid" style="margin-top:8px"><input id="username" value="admin"><input id="password" type="password" placeholder="Password"><input id="mfa" value="123456"><button class="primary" onclick="login()">Sign in</button></div><div id="sessionState" class="muted" style="margin-top:6px">Not signed in.</div></div>
<div class="card"><b>Queue filters</b><div class="grid" style="margin-top:8px"><input id="q" placeholder="Job / module / record / action..." oninput="load()"><select id="status" onchange="load()"><option value="">All</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>RETURN_FOR_CORRECTION</option></select><button onclick="load()">Refresh</button></div></div>
<div id="summary"></div><div id="queue"></div>
</div>
<script>
let token=localStorage.getItem('m3-clx033-session')||'';const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers['X-M3-Session']=token;let r=await fetch(url,opt),d;try{d=await r.json()}catch{d={detail:await r.text()}}if(!r.ok)throw new Error(JSON.stringify(d.detail||d));return d}
async function login(){try{let d=await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,mfa_code:$('mfa').value})});token=d.session_token;localStorage.setItem('m3-clx033-session',token);$('sessionState').textContent='Signed in as '+d.username+' · '+d.roles.join(', ');await load()}catch(e){$('sessionState').innerHTML='<span class=bad>'+esc(e.message)+'</span>'}}
async function decide(ref,decision){let comment=prompt('Approval comment / reason','CLX-033 governed decision')||'';try{let d=await api('/api/clx033/reviews/'+encodeURIComponent(ref)+'/decision',{method:'POST',body:JSON.stringify({decision,comment,reason_code:decision})});alert(d.status);await load()}catch(e){alert(e.message)}}
async function reopen(chain){let comment=prompt('Correction / reopen comment','Correction completed')||'';if(!comment)return;try{let d=await api('/api/clx033/chains/'+encodeURIComponent(chain)+'/reopen',{method:'POST',body:JSON.stringify({comment})});alert(d.status+' · '+d.chain_id);await load()}catch(e){alert(e.message)}}
async function load(){try{let d=await api('/api/clx033/workbench?q='+encodeURIComponent($('q').value)+'&status='+encodeURIComponent($('status').value));let pending=d.items.filter(x=>x.state==='PENDING').length,blocked=d.items.filter(x=>['REJECTED','RETURN_FOR_CORRECTION'].includes(x.state)).length;$('summary').innerHTML='<div class=card><b>'+d.count+' approval chains</b> · '+pending+' pending · '+blocked+' rejected/returned · Actor '+esc(d.actor)+'</div>';
$('queue').innerHTML='<div class=card><div class=table><table><thead><tr><th>Chain</th><th>Type</th><th>Module</th><th>Record</th><th>Action</th><th>Amount</th><th>Scope</th><th>Progress</th><th>State</th><th>Original record</th><th>Actions</th></tr></thead><tbody>'+d.items.map(x=>'<tr><td>'+esc(x.chain_id)+'</td><td>'+esc(x.transaction_type)+'</td><td>'+esc(x.module)+'</td><td>'+esc(x.record_id)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.currency)+' '+esc(x.amount)+'</td><td>'+esc((x.office_code||'*')+' / '+(x.country_code||'*'))+'</td><td>'+esc(x.approved_levels)+' / '+esc(x.required_levels)+'</td><td>'+esc(x.state)+'</td><td><code>'+esc(x.target_url)+'</code></td><td>'+(x.next_pending?'<button onclick="decide(\''+esc(x.next_pending)+'\',\'APPROVE\')">Approve</button> <button onclick="decide(\''+esc(x.next_pending)+'\',\'REJECT\')">Reject</button> <button onclick="decide(\''+esc(x.next_pending)+'\',\'RETURN_FOR_CORRECTION\')">Return</button>':'')+(['REJECTED','RETURN_FOR_CORRECTION'].includes(x.state)?' <button onclick="reopen(\''+esc(x.chain_id)+'\')">Reopen</button>':'')+'</td></tr>').join('')+'</tbody></table></div></div>'}catch(e){$('queue').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
