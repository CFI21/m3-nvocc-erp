<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 NVOCC ERP — CLX-010 Administration + Master Data Governance</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#d7dde5;--ink:#1d2939;--muted:#667085;--brand:#2f6b55;--nav:#1f2d2a;--nav2:#29423b;--ok:#027a48;--warn:#b54708}*{box-sizing:border-box}body{margin:0;font:12px Arial;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;height:100vh;position:sticky;top:0;overflow:auto}.logo{padding:16px;border-bottom:1px solid #38524a}.logo b{font-size:18px}.logo small{display:block;color:#b8cbc5;margin-top:3px}.search{padding:10px}.search input{width:100%;padding:8px;border:1px solid #476158;border-radius:5px;background:#17221f;color:#fff}.group{padding:10px 12px 5px;color:#9fb9b0;font-size:10px;font-weight:bold;letter-spacing:.7px}.nav{padding:8px 12px;border-left:3px solid transparent;cursor:pointer}.nav:hover,.nav.active{background:var(--nav2);border-left-color:#7cc69b}.main{min-width:0}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;position:sticky;top:0;z-index:10}.pill{padding:4px 8px;border-radius:12px;background:#e8f3ed;color:var(--brand);font-weight:bold}.content{padding:14px}.cards{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px}.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:11px}.card b{font-size:18px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar select,button{padding:7px;border:1px solid #b8c2cf;border-radius:4px;background:#fff}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.tablewrap{background:#fff;border:1px solid var(--line);overflow:auto;max-height:70vh}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:7px 8px;border-bottom:1px solid #e7ebf0;text-align:left;white-space:nowrap}th{background:#edf2f5;position:sticky;top:0;cursor:pointer}tr:hover td{background:#f9fbfc}.drawer{position:fixed;right:0;top:58px;bottom:0;width:420px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px #0001;transform:translateX(100%);transition:.18s;z-index:20;overflow:auto}.drawer.open{transform:none}.drawerhead{padding:12px;border-bottom:1px solid var(--line);display:flex}.drawerbody{padding:12px}.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.drawer{width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><b>M3 NVOCC ERP</b><small>CLX-010 · Administration + Master Data Governance</small></div><div class="search"><input id="menuSearch" placeholder="Search menu..." oninput="renderNav()"></div><div id="nav"></div></aside><main class="main"><div class="top"><span class="pill">CLX-010</span><b id="title">Governance Dashboard</b><span style="flex:1"></span><select id="role"><option>SUPER_ADMIN</option><option>MASTER_DATA_MANAGER</option><option>MASTER_DATA</option><option>OPS</option><option>FINANCE</option><option>AUDITOR</option><option>VIEWER</option></select><button onclick="window.open('/static/M3_NVOCC_ERP_CLX-009_BULK_BUILD_20260924.html','_blank')">Open Core ERP</button></div><div class="content" id="view"></div></main></div><aside class="drawer" id="drawer"><div class="drawerhead"><b id="drawerTitle">Quick View</b><span style="flex:1"></span><button onclick="drawer.classList.remove('open')">×</button></div><div class="drawerbody" id="drawerBody"></div></aside><script>
const adminScreens=['dashboard','users','user-status','roles','permission-matrix','role-assignments','organizations','countries','legal-entities','offices','branches','departments','office-membership','data-scope-rules','customer-agent-access','approval-limits','maker-checker','approval-delegations','temporary-access','access-reviews','sessions','password-policy','mfa-policy','sso-readiness','login-audit','service-accounts','api-clients','identity-audit'];
const mdDomains={'customers':'customer','agents':'agent','carriers':'carrier','ports':'port','locations':'location','vessels':'vessel','voyages':'voyage','equipment-types':'equipment-type','container-types':'container-type','commodities':'commodity','packages':'package','charge-codes':'charge-code','tax-codes':'tax-code','currencies':'currency','exchange-rate-types':'exchange-rate-type','payment-terms':'payment-term','banks':'bank','bank-accounts':'bank-account','gl-accounts':'gl-account','cost-centers':'cost-center','profit-centers':'profit-center','trade-lanes':'trade-lane','services':'service','routes':'route','incoterms':'incoterm','document-types':'document-type','release-types':'release-type','reference-sequences':'reference-sequence','configuration':'configuration'};
const mdGov=['master-dashboard','change-requests','approval-queue','versions','duplicate-review','aliases-merges','data-quality','reference-usage','effective-dates','sequence-control','integrity-scan','hardcoded-scan','master-audit'];let current='dashboard',sortKey='',sortAsc=true,page=1,pageSize=20,rowsCache=[];
const label=x=>x.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
function renderNav(){let q=(menuSearch.value||'').toLowerCase(),html='';const add=(g,items)=>{let f=items.filter(x=>label(x).toLowerCase().includes(q));if(!f.length)return;html+=`<div class=group>${g}</div>`+f.map(x=>`<div class="nav ${current===x?'active':''}" onclick="go('${x}')">${label(x)}</div>`).join('')};add('ADMINISTRATION',adminScreens);add('MASTER DATA',Object.keys(mdDomains));add('GOVERNANCE',mdGov);nav.innerHTML=html}
async function get(u){let r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.json()}
function show(r){drawerTitle.textContent='Quick View';drawerBody.innerHTML='<pre style="white-space:pre-wrap">'+escapeHtml(JSON.stringify(r,null,2))+'</pre>';drawer.classList.add('open')}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function grid(rows){rowsCache=rows||[];let q=(document.getElementById('gridSearch')?.value||'').toLowerCase();let filtered=rowsCache.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));if(sortKey)filtered.sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''))*(sortAsc?1:-1));let total=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,total);let slice=filtered.slice((page-1)*pageSize,page*pageSize);if(!slice.length)return '<div class=card>No records</div>';let ks=Object.keys(slice[0]).filter(k=>k!=='payload_json');return `<div class=toolbar><input id=gridSearch placeholder="Search grid..." oninput="rerenderGrid()"><select onchange="pageSize=+this.value;page=1;rerenderGrid()"><option>20</option><option>50</option><option>100</option></select><button onclick="page=Math.max(1,page-1);rerenderGrid()">Prev</button><span class=muted>Page ${page}/${total}</span><button onclick="page=Math.min(${total},page+1);rerenderGrid()">Next</button><button onclick="exportCsv()">Export</button></div><div class=tablewrap><table><thead><tr>${ks.map(k=>`<th onclick="setSort('${k}')">${k}${sortKey===k?(sortAsc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${slice.map((r,i)=>`<tr onclick='show(${JSON.stringify(JSON.stringify(r))})'>${ks.map(k=>`<td>${escapeHtml(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function setSort(k){sortKey=k;sortAsc=sortKey===k?!sortAsc:true;rerenderGrid()}function rerenderGrid(){let holder=document.getElementById('gridHolder');if(holder)holder.innerHTML=grid(rowsCache)}function exportCsv(){if(!rowsCache.length)return;let ks=Object.keys(rowsCache[0]);let csv=[ks.join(','),...rowsCache.map(r=>ks.map(k=>'"'+String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='m3-clx010-export.csv';a.click()}
async function go(x){current=x;page=1;sortKey='';renderNav();title.textContent=label(x);view.innerHTML='<div class=card>Loading…</div>';try{
 if(x==='dashboard'){let [a,m]=await Promise.all([get('/api/admin/overview'),get('/api/masterdata/overview')]);view.innerHTML=`<div class=cards><div class=card><span>Users</span><br><b>${a.users}</b></div><div class=card><span>Admin screens</span><br><b>${a.screens}</b></div><div class=card><span>Master domains</span><br><b>${m.domains}</b></div><div class=card><span>Master records</span><br><b>${m.records}</b></div><div class=card><span>Pending changes</span><br><b>${m.pending_changes}</b></div></div><div class=card style="margin-top:10px"><b>CLX-010 Governance</b><p>Identity / RBAC / data scope + governed master data + centralized references. Direct master edits are disabled: Maker → Change Request → Independent Checker → Versioned Activation → Immutable Audit.</p></div>`;return}
 if(mdDomains[x]){let d=mdDomains[x],rows=await get('/api/masterdata/records/'+d);view.innerHTML=`<div class=toolbar><button class=primary onclick="newChange('${d}')">+ Change Request</button><button onclick="go('reference-usage')">Reference Usage</button><span class=muted>Hard delete disabled; deactivate or alias/merge.</span></div><div id=gridHolder>${grid(rows)}</div>`;return}
 if(x==='master-dashboard'){let m=await get('/api/masterdata/overview');view.innerHTML='<pre>'+escapeHtml(JSON.stringify(m,null,2))+'</pre>';return}
 let adminMap={'users':'/api/admin/users','user-status':'/api/admin/users','roles':'/api/admin/roles','permission-matrix':'/api/admin/permissions','role-assignments':'/api/admin/roles','organizations':'/api/admin/organizations','countries':'/api/admin/countries','legal-entities':'/api/admin/legal-entities','offices':'/api/admin/offices','branches':'/api/admin/branches','departments':'/api/admin/departments','office-membership':'/api/admin/office-membership','data-scope-rules':'/api/admin/scope-rules','customer-agent-access':'/api/admin/party-access','approval-limits':'/api/admin/approval-limits','maker-checker':'/api/admin/maker-checker','approval-delegations':'/api/admin/delegations','temporary-access':'/api/admin/temporary-access','access-reviews':'/api/admin/access-reviews','sessions':'/api/admin/sessions','password-policy':'/api/admin/policies','mfa-policy':'/api/admin/policies','sso-readiness':'/api/admin/sso-readiness','login-audit':'/api/admin/login-audit','service-accounts':'/api/admin/service-accounts','api-clients':'/api/admin/api-clients','identity-audit':'/api/admin/audit'};
 if(adminMap[x]){let d=await get(adminMap[x]);let rows=Array.isArray(d)?d:(d.conflicts||[d]);view.innerHTML=`<div id=gridHolder>${grid(rows)}</div>`;return}
 let mdMap={'change-requests':'/api/masterdata/changes','approval-queue':'/api/masterdata/changes?status=PENDING','versions':'/api/masterdata/changes','duplicate-review':'/api/masterdata/duplicates','aliases-merges':'/api/masterdata/aliases','data-quality':'/api/masterdata/quality','reference-usage':'/api/masterdata/usage/reference-sequence/JOB','effective-dates':'/api/masterdata/changes','sequence-control':'/api/masterdata/sequences','integrity-scan':'/api/masterdata/integrity','hardcoded-scan':'/api/masterdata/hardcoded-scan','master-audit':'/api/masterdata/audit'};
 if(mdMap[x]){let d=await get(mdMap[x]);if(Array.isArray(d))view.innerHTML=`<div id=gridHolder>${grid(d)}</div>`;else view.innerHTML='<pre>'+escapeHtml(JSON.stringify(d,null,2))+'</pre>';return}
 }catch(e){view.innerHTML='<div class=card><b class=warn>Error</b><pre>'+escapeHtml(e.message)+'</pre></div>'}}
function newChange(d){drawerTitle.textContent='New '+label(d)+' Change';drawerBody.innerHTML=`<p><input id=k placeholder="Record key" style="width:100%"></p><p><select id=op style="width:100%"><option>CREATE</option><option>UPDATE</option><option>DEACTIVATE</option><option>ACTIVATE</option></select></p><p><input id=n placeholder="Display name" style="width:100%"></p><p><input id=reason placeholder="Reason" style="width:100%"></p><button class=primary onclick="submitChange('${d}')">Submit for Approval</button>`;drawer.classList.add('open')}
async function submitChange(d){let r=await fetch('/api/masterdata/changes',{method:'POST',headers:{'Content-Type':'application/json','X-Role':role.value,'X-User':'ui-maker'},body:JSON.stringify({domain:d,record_key:k.value,operation:op.value,payload:n.value?{name:n.value}:{},reason:reason.value||'UI change'})});alert(JSON.stringify(await r.json()));drawer.classList.remove('open');go('change-requests')}
renderNav();go('dashboard');
</script></body></html>
